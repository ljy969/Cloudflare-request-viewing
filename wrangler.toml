# Cloudflare Pages 部署配置
# 此文件告诉 Cloudflare Pages 如何构建和部署应用

name = "cf-usage-tracker"
compatibility_date = "2024-01-01"

# 构建输出目录（静态文件）
# 不需要构建步骤，直接使用根目录文件
public_output = "."

# 环境变量
[vars]
  NODE_VERSION = "2024"

# 说明：Pages 项目的 *.pages.dev 域名由平台自动分配，无需（也不支持）在此配置 routes。
# 如需绑定自定义域名，请在 Cloudflare Pages 控制台中设置，而非使用 Workers 的 routes 配置。